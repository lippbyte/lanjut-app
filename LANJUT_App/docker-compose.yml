services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Wajib mengisi DB_ROOT_PASSWORD di tab Environment Dokploy}
      MYSQL_DATABASE: ${DB_NAME:-lanjut_db}
      MYSQL_USER: ${DB_USER:-lanjut_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Wajib mengisi DB_PASSWORD di tab Environment Dokploy}
    volumes:
      - lanjut_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-lanjut_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-lanjut_db}
      CORS_ORIGINS: ${CORS_ORIGINS:?Wajib mengisi CORS_ORIGINS (https://...) di tab Environment Dokploy}
      SESI_UMUR_HARI: ${SESI_UMUR_HARI:-90}
      # 2 hop jika melewati Traefik (Dokploy) -> Nginx (web) -> Express (api),
      # atau 1 hop jika domain API diarahkan langsung dari Traefik (Dokploy) ke service `api`.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      HEADER_IP_KLIEN: ${HEADER_IP_KLIEN:-x-real-ip}
      LOKASI_DATA_KONTEN: data-konten
      JALANKAN_BENIH: ${JALANKAN_BENIH:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    command: >
      sh -c "npm run migrasi &&
      if [ \"$$JALANKAN_BENIH\" = \"true\" ]; then npm run benih; fi &&
      node src/index.js"
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?Wajib mengisi EXPO_PUBLIC_API_URL di tab Environment Dokploy}
        EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        EXPO_PUBLIC_GOOGLE_REDIRECT_URI: ${EXPO_PUBLIC_GOOGLE_REDIRECT_URI:-}
        EXPO_PUBLIC_MIKROFON_NGOBROL: ${EXPO_PUBLIC_MIKROFON_NGOBROL:-0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

volumes:
  lanjut_db_data:
