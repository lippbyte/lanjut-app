# Meneruskan IP klien asli dari Traefik (Dokploy) jika sudah ada,
# atau fallback ke $remote_addr jika diakses langsung tanpa Traefik.
map $http_x_real_ip $real_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gunakan DNS internal Docker agar Nginx tidak gagal jika kontainer `api` di-restart oleh Dokploy
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Batas ukuran unggahan untuk berkas PDF modul belajar (LANJUT_049)
    client_max_body_size 15m;

    # Kompresi Gzip untuk aset statis web
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Teruskan permintaan API ke kontainer backend (service `api` di docker-compose.yml)
    location /api/v1/ {
        set $upstream_api http://api:4000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Endpoint pemeriksaan kesehatan backend
    location = /health {
        set $upstream_api http://api:4000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
    }

    # Cache aset statis hasil bundel Expo (_expo/static)
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA untuk rute Expo Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
