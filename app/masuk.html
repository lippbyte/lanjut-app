<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · LANJUT</title>
<meta name="description" content="Masuk ke akun LANJUT kamu.">
<meta name="theme-color" content="#456A8C">
<meta name="lanjut-api-base" content="/api/v1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="assets/img/mascot-tile-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">

<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js" defer></script>
<script src="assets/api.js" defer></script>
</head>

<!-- Halaman pra-akun, tanpa navigasi bawah — sama alasannya dengan
     daftar.html (lihat komentar di sana dan tools/check.js §4). -->
<body data-peran="masuk">
<a class="lewati" href="#isi">Lewati ke konten</a>

<div class="app">

  <header class="appbar">
    <img class="appbar__mark" src="assets/img/mascot-blue.png" alt="" width="32" height="32">
    <p class="appbar__wordmark"><img src="assets/img/lanjut-wordmark-w660.png" alt="LANJUT"></p>
  </header>

  <main class="layar" id="isi">
    <div class="layar__isi">

      <div class="kepala">
        <h1>Masuk</h1>
        <p>Lanjutkan dengan akun yang sudah kamu buat.</p>
      </div>

      <!-- Tampil hanya kalau datang dari daftar.html?daftar=selesai —
           pasangMasuk() yang membaca query string dan membuka blok ini.
           Teks belum ada di salinan-teks-lanjut.md, lihat catatan di
           assets/api.js. -->
      <p class="kartu kartu--soft" data-keadaan="baru-daftar" hidden
         style="font:var(--text-body-small);color:var(--ink-700)">
        Akun kamu sudah dibuat. Masuk dengan nama pengguna dan kata sandi yang
        baru saja kamu isi.
      </p>

      <form class="tumpuk" style="gap:var(--space-5)" data-form="masuk">

        <div class="field">
          <label class="field__label" for="nama_pengguna">Nama pengguna</label>
          <input class="input" id="nama_pengguna" name="nama_pengguna" type="text"
                 autocomplete="username" required autofocus placeholder="Nama penggunamu">
        </div>

        <div class="field">
          <label class="field__label" for="kata_sandi">Kata sandi</label>
          <input class="input" id="kata_sandi" name="kata_sandi" type="password"
                 autocomplete="current-password" required placeholder="Kata sandimu">
        </div>

        <p class="field__error" role="alert" data-isi="galat-masuk" hidden></p>

        <button type="submit" class="btn btn--lg btn--penuh" data-tombol="submit">
          <span data-keadaan="idle">Masuk</span>
          <span data-keadaan="proses" hidden>Memeriksa&hellip;</span>
        </button>

        <p style="text-align:center">
          Belum punya akun? <a href="daftar.html">Daftar</a>
        </p>
      </form>

      <p class="penafian">
        Tidak masuk pun aplikasi ini tetap bisa dipakai penuh — datamu
        tersimpan di perangkat ini.
      </p>

    </div>
  </main>

  <noscript>
    <div style="padding:var(--gutter-screen)">
      <a class="btn btn--secondary btn--penuh" href="beranda.html">Lewati, lanjut sebagai tamu</a>
    </div>
  </noscript>

</div>

</body>
</html>
